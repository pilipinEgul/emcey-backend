name: Backend CI/CD

# Laravel 13 API → Hostinger Premium (shared, PHP 8.3 + MySQL 8) over SSH.
#
#   pull_request        → run test suite only (no deploy)
#   push to `staging`   → test, build, deploy to staging-api.emcey-brows-aesthetics.com
#   push to `main`      → test, build, deploy to api.emcey-brows-aesthetics.com
#
# Strategy: dependencies + assets are built on the GitHub runner (reliable PHP/
# Node), then rsync'd to Hostinger. The server never runs composer/npm, which
# sidesteps shared-hosting memory limits. Artisan migrate + caches run over SSH.

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Never cancel an in-flight deploy; do serialise per branch.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (PHP 8.3, SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, curl, dom
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Build & deploy
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # GitHub Environments give you per-env secrets + optional approval gates.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, intl, curl, dom
          tools: composer

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build production dependencies & assets
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          npm ci
          npm run build

      - name: Resolve target environment
        id: target
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "path=${{ secrets.DEPLOY_PATH }}"       >> "$GITHUB_OUTPUT"
            echo "url=https://api.emcey-brows-aesthetics.com" >> "$GITHUB_OUTPUT"
          else
            echo "path=${{ secrets.DEPLOY_PATH }}"       >> "$GITHUB_OUTPUT"
            echo "url=https://staging-api.emcey-brows-aesthetics.com" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to Hostinger
        # --delete keeps the server clean, but .env / storage / uploads are
        # excluded so live data and secrets on the server are never touched.
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ steps.target.outputs.path }}/"

      - name: Migrate & cache (over SSH)
        env:
          PHP_BIN: ${{ vars.PHP_BIN || 'php' }}
          DEPLOY_PATH: ${{ steps.target.outputs.path }}
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd '$DEPLOY_PATH'; \
             $PHP_BIN artisan migrate --force; \
             $PHP_BIN artisan config:cache; \
             $PHP_BIN artisan route:cache; \
             $PHP_BIN artisan view:cache; \
             $PHP_BIN artisan event:cache; \
             $PHP_BIN artisan storage:link 2>/dev/null || true"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "${{ steps.target.outputs.url }}/api/v1/services?featured=1")
          echo "GET /api/v1/services?featured=1 -> $code"
          if [ "$code" != "200" ]; then
            echo "::error::Smoke test failed (HTTP $code) at ${{ steps.target.outputs.url }}"
            exit 1
          fi
