name: Deploy Staging

# Push to `staging` → test → build → deploy to staging-api.emcey-brows-aesthetics.com
on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy to staging
    needs: test
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_PATH: /home/u279697774/laravel/api-staging
      APP_URL: https://staging-api.emcey-brows-aesthetics.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, bcmath, intl, curl, dom
          tools: composer

      - name: Build production dependencies
        # API-only deploy: no Blade views, so no frontend asset build (no npm).
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Configure SSH
        # SSH_PRIVATE_KEY holds the base64-encoded key (single line, immune to
        # newline mangling in the GitHub secrets UI). Decode it back to PEM here.
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync to Hostinger
        # .env / storage / uploads are excluded so server data & secrets survive.
        run: |
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='node_modules/' \
            --exclude='/storage/' \
            --exclude='/public/storage' \
            -e "ssh -p ${{ secrets.SSH_PORT }}" \
            ./ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$DEPLOY_PATH/"

      - name: Sync app config to server .env
        # The server .env is excluded from rsync, so push the staging
        # environment variables into it here (upsert: replace if present, else
        # append). Values are passed via step env + base64 and never echoed, so
        # they don't appear in logs (GitHub does NOT mask `vars.*`). printf %s
        # keeps values literal, so MAIL_FROM_NAME's ${APP_NAME} stays unexpanded.
        env:
          GOOGLE_CALENDAR_BLOCK_AVAILABILITY: ${{ vars.GOOGLE_CALENDAR_BLOCK_AVAILABILITY }}
          GOOGLE_CALENDAR_ENABLED: ${{ vars.GOOGLE_CALENDAR_ENABLED }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
          GOOGLE_CALENDAR_TIMEZONE: ${{ vars.GOOGLE_CALENDAR_TIMEZONE }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ vars.GOOGLE_SERVICE_ACCOUNT_KEY }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_MAILER: ${{ vars.MAIL_MAILER }}
          MAIL_PASSWORD: ${{ vars.MAIL_PASSWORD }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_SCHEME: ${{ vars.MAIL_SCHEME }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
        run: |
          b64=$(
            {
              printf 'GOOGLE_CALENDAR_BLOCK_AVAILABILITY=%s\n' "$GOOGLE_CALENDAR_BLOCK_AVAILABILITY"
              printf 'GOOGLE_CALENDAR_ENABLED=%s\n' "$GOOGLE_CALENDAR_ENABLED"
              printf 'GOOGLE_CALENDAR_ID=%s\n' "$GOOGLE_CALENDAR_ID"
              printf 'GOOGLE_CALENDAR_TIMEZONE=%s\n' "$GOOGLE_CALENDAR_TIMEZONE"
              printf 'GOOGLE_SERVICE_ACCOUNT_KEY=%s\n' "$GOOGLE_SERVICE_ACCOUNT_KEY"
              printf 'MAIL_FROM_ADDRESS=%s\n' "$MAIL_FROM_ADDRESS"
              printf 'MAIL_FROM_NAME=%s\n' "$MAIL_FROM_NAME"
              printf 'MAIL_HOST=%s\n' "$MAIL_HOST"
              printf 'MAIL_MAILER=%s\n' "$MAIL_MAILER"
              printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD"
              printf 'MAIL_PORT=%s\n' "$MAIL_PORT"
              printf 'MAIL_SCHEME=%s\n' "$MAIL_SCHEME"
              printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME"
            } | base64 -w0
          )
          ssh -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' PAYLOAD='$b64' bash -s" <<'REMOTE'
          set -e
          env_file="$DEPLOY_PATH/.env"
          tmp="$(mktemp)"
          printf '%s' "$PAYLOAD" | base64 -d > "$tmp"
          touch "$env_file"
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            key="${line%%=*}"
            grep -v "^${key}=" "$env_file" > "$env_file.new" || true
            mv "$env_file.new" "$env_file"
            printf '%s\n' "$line" >> "$env_file"
          done < "$tmp"
          rm -f "$tmp"
          REMOTE

      - name: Migrate & cache (over SSH)
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; cd '$DEPLOY_PATH'; \
             php artisan migrate --force; \
             php artisan config:cache; \
             php artisan route:cache; \
             php artisan view:cache; \
             php artisan event:cache; \
             php artisan storage:link 2>/dev/null || true"

      - name: Smoke test
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL/api/v1/services?featured=1")
          echo "GET $APP_URL/api/v1/services?featured=1 -> $code"
          [ "$code" = "200" ] || { echo "::error::Smoke test failed (HTTP $code)"; exit 1; }
